[osage]
out = "out"
number_of_concurrent_containers = 8

[checks]
only_enabled = true

[src]
directory = "src"
only_enabled = true

[compiler]
directory = "compiler"
only_enabled = true
timeout = 3600

[transformer]
directory = "transformer"
only_enabled = true

[analyzer]
directory = "analyzer"
only_enabled = true
timeout = 3600
