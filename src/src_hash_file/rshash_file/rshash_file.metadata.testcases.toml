# This program reads its input from the FILE named by argv[1].
# The current in/out test harness passes argv/stdin only (it cannot create a
# file from `filecontent`), so the content-driven cases are kept commented out
# below with their correct expected output. The active cases need no file content.

[testcase_missing_args]
    arguments = []
    stdout = ""
    exit_code = 2

[testcase_missing_file]
    arguments = ["/nonexistent_osage_file",]
    stdout = ""
    exit_code = 1

[testcase_file_argument]
    # Run-only: hashes a real file; output is content-dependent so it is not checked.
    arguments = ["/etc/hostname",]
    stdout_capture = false
    stdout = "You did NOT want this."
    exit_code = 0

