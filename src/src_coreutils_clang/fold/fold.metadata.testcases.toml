[testcase_s1]
    arguments = ["-w2", "-s"]
    stdin = "a\t"
    stdout = "a\n\t"
    exit_code = 0

[testcase_s2]
    arguments = ["-w4", "-s"]
    stdin = "abcdef d\n"
    stdout = "abcd\nef d\n"
    exit_code = 0

[testcase_s3]
    arguments = ["-w4", "-s"]
    stdin = "a cd fgh\n"
    stdout = "a \ncd \nfgh\n"
    exit_code = 0

[testcase_s4]
    arguments = ["-w4", "-s"]
    stdin = "abc ef\n"
    stdout = "abc \nef\n"
    exit_code = 0

[testcase_bw1]
    arguments = ["-b", "-w", "4"]
    stdin = "abcdef\nghijkl"
    stdout = "abcd\nef\nghij\nkl"
    exit_code = 0

[testcase_bw2]
    arguments = ["-b", "-w", "6"]
    stdin = "1234567890\nabcdefghij\n1234567890"
    stdout = "123456\n7890\nabcdef\nghij\n123456\n7890"
    exit_code = 0
