    arguments = ["-b"]
    stdin = "\na\nb\nc"
    stdout = "\nc\nb\na"
    exit_code = 0

[testcase_opt-s]
    arguments = ["-s:"]
    stdin = "a:b:c:"
    stdout = "c:b:a:"
    exit_code = 0

[testcase_opt-sb]
    arguments = ["-s", ":", "-b"]
    stdin = ":a:b:c"
    stdout = ":c:b:a"
    exit_code = 0

[testcase_opt-r]
    arguments = ["-r", "-s", "\._+"]
    stdin = "1._2.__3.___4._"
    stdout = "4._3.___2.__1._"
    exit_code = 0

[testcase_opt-r2]
    arguments = ["-r", "-s", "\._+"]
    stdin = "a.___b.__1._2.__3.___4._"
    stdout = "4._3.___2.__1._b.__a.___"
    exit_code = 0

[testcase_opt-r3]
    arguments = ["-r", "-s", "^"]
    stdin = "a\nb\nc\n"
    stdout = "c\nb\na\n"
    exit_code = 0

[testcase_opt-r4]
    arguments = ["-r", "-s", "$"]
    stdin = "a\nb\nc\n"
    stdout = "\n\nc\nba"
    exit_code = 0

[testcase_opt-r5]
    arguments = ["-r", "-s", "^$"]
    stdin = "a\nb\nc\n"
    stdout = "a\nb\nc\n"
    exit_code = 0

[testcase_opt-br]
    arguments = ["-b", "-r", "-s", "\._+"]
    stdin = "._1._2.__3.___4"
    stdout = ".___4.__3._2._1"
